# Builds Mida for Windows on every push (and on demand from the Actions tab), then runs it on
# GitHub's Windows machine with real sites and saves screenshots (scripts/smoke-test.ps1).
#
# Releasing an update: raise "version" in package.json (and package-lock.json) and push to main.
# (src-tauri/Cargo.toml's version stays 0.0.0 on purpose: the app's version comes from package.json,
# and leaving Cargo's alone keeps the build cache valid across releases.) The build then signs
# the installer with Mida's update key (the TAURI_SIGNING_PRIVATE_KEY secret) and publishes a
# GitHub release "v<version>" with the installer, its signature and latest.json, which every
# installed Mida checks. Other pushes only build a test installer (the run's Artifacts:
# "mida-windows" and the "smoke-test" screenshots); nobody's app changes.
name: Build

on:
  push:
    # Text-only changes (README, notes, artwork sources) don't need a build.
    paths-ignore: ["**.md", "art/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: write # needed to create releases; the token is GitHub's own, per run

# A newer push replaces a build still running for the same branch, so two builds never race
# to publish the same release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Is this a new version?
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A release (not just a tag) decides it, so a failed attempt is retried on the next push.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! gh release view "v$version" > /dev/null 2>&1; then
            if [ "$HAS_KEY" != "true" ]; then
              echo "::error::Can't release v$version: the TAURI_SIGNING_PRIVATE_KEY secret is missing (see CLAUDE.md)."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released (or this isn't main): test build only"
          fi

      - uses: dtolnay/rust-toolchain@stable
      # Keeps compiled Rust libraries between runs, so builds after the first are much faster.
      # Release and test builds use different settings (below), so each keeps its own cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ steps.version.outputs.release == 'true' && 'release' || 'test' }}
      # npm ci installs exactly the versions in package-lock.json.
      - run: npm ci --no-audit --no-fund

      # Says whether the Bungie API key secret looks right and whether Bungie accepts it; never
      # prints the key itself.
      - name: Check the Bungie API key
        shell: bash
        env:
          KEY: ${{ secrets.MIDA_BUNGIE_API_KEY }}
        run: |
          key="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          if [ -z "$key" ]; then echo "::warning::MIDA_BUNGIE_API_KEY is empty or missing: this build can't sign in."; exit 0; fi
          [ "$key" != "$KEY" ] && echo "Note: the secret has spaces or line breaks around it (Mida ignores them)."
          echo "Length: ${#key} characters (a Bungie API key is 32)."
          if [[ "$key" =~ ^[0-9a-fA-F]{32}$ ]]; then echo "Shape: looks like a Bungie API key."; else echo "::warning::Shape: doesn't look like a Bungie API key (32 letters a-f and digits)."; fi
          answer=$(curl -s -H "X-API-Key: $key" "https://www.bungie.net/Platform/Destiny2/Milestones/" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.ErrorCode+" "+j.ErrorStatus)}catch{console.log("no answer")}})')
          echo "Bungie says: $answer"
          case "$answer" in 1\ *) ;; *) echo "::warning::Bungie didn't accept MIDA_BUNGIE_API_KEY ($answer).";; esac

      - name: Build and sign (release)
        if: steps.version.outputs.release == 'true'
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Built into the app for Bungie sign-in (src/auth.rs); never printed.
          MIDA_BUNGIE_API_KEY: ${{ secrets.MIDA_BUNGIE_API_KEY }}

      - name: Build (test)
        if: steps.version.outputs.release != 'true'
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          MIDA_BUNGIE_API_KEY: ${{ secrets.MIDA_BUNGIE_API_KEY }}
          # Test builds skip the slow whole-program shrinking that releases get (Cargo.toml's
          # release profile); they're a little bigger but build minutes faster.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      # Releases are the same code as the test build just checked plus a version number, so they
      # skip the screenshot run.
      - name: Try it on Windows with real sites
        if: steps.version.outputs.release != 'true'
        shell: pwsh
        run: ./scripts/smoke-test.ps1

      # Also put the screenshots on the "ci-screenshots" branch (replaced each run), where Claude can
      # read them: the cloud workspace can't download Actions artifacts.
      - name: Share the screenshots
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$(ls smoke/*.png 2>/dev/null)" ] || exit 0
          cd smoke
          git init -q -b ci-screenshots
          git add *.png
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Smoke test screenshots: ${GITHUB_REF_NAME} ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/*.png
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: mida-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir=src-tauri/target/release/bundle/nsis
          exe="$dir/Mida_${VERSION}_x64-setup.exe"
          # latest.json is what installed copies read to find the new version and check its signature.
          node -e '
            const fs = require("fs");
            const [version, exe] = process.argv.slice(1);
            const name = require("path").basename(exe);
            fs.writeFileSync("latest.json", JSON.stringify({
              version,
              notes: `Mida ${version}`,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": {
                signature: fs.readFileSync(exe + ".sig", "utf8").trim(),
                url: `https://github.com/cee86/mida/releases/download/v${version}/${name}`,
              } },
            }, null, 2));
          ' "$VERSION" "$exe"
          # Creates the tag at this commit and publishes in one go. --latest: installed copies look for
          # updates under "latest", which GitHub would otherwise give to the highest version number.
          gh release create "v$VERSION" "$exe" "$exe.sig" latest.json \
            --target "$GITHUB_SHA" --title "$VERSION" --notes "Mida $VERSION" --latest
