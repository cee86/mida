<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- The floating site controls: shown in a corner of the site when the address bar is hidden.
       Our own page, like the shell (same security policy, see tauri.conf.json). -->
  <title>Site controls</title>
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="controls.css">
  <link rel="stylesheet" href="foundry.css">
</head>
<body>
  <div class="ctl" role="toolbar" aria-label="Site controls">
    <button class="icon-btn" id="back" type="button" aria-label="Back" title="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="icon-btn" id="forward" type="button" aria-label="Forward" title="Forward">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="icon-btn" id="reload" type="button" aria-label="Reload" title="Reload">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4"/></svg>
    </button>
    <button class="icon-btn" id="home" type="button" aria-label="Site home page" title="Site home page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6M6.5 9.5V19h11V9.5"/></svg>
    </button>
    <button class="icon-btn" id="external" type="button" aria-label="Open in your browser" title="Open in your browser">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M17 14v5H5V7h5"/></svg>
    </button>
    <span class="ctl__progress" id="progress" aria-hidden="true"></span>
  </div>
  <script src="theme.js"></script>
  <script src="bridge.js"></script>
  <script src="controls.js"></script>
</body>
</html>
